name: sajilo_khata
description: "Nepal SMS-based expense tracker with savings goals."
publish_to: "none"

version: 1.0.1+0

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.1.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # Local Storage (offline cache)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SMS reading for android
  # another_telephony: ^0.4.1

  # Chart
  fl_chart: ^1.2.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  #Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  http: ^1.2.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Permissions
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.3

  # SMS reading
  android_sms_reader: ^0.0.6
  provider: ^6.1.5+1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#F4F6F2"
  adaptive_icon_foreground: "assets/sajilo_khata_logo.png"
  adaptive_icon_foreground_inset: 16
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#F4F6F2"
  image_path: "assets/sajilo_khata_logo.png"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/sajilo_khata_logo.png
    - assets/fonts/

  fonts:
    # Theme font (theme_template.md).
    # IMPORTANT: GoogleFonts.<family>() resolves bundled fonts by looking for an
    # asset whose path ENDS WITH the Google Fonts API file name, which has no
    # spaces - e.g. "PlusJakartaSans-Bold.ttf" / "JetBrainsMono-Bold.ttf"
    # (runtime fetching is disabled in main.dart, so these must exist).
    # The Flutter font family itself keeps its display name ("Plus Jakarta Sans").
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    # Monospace numerals (AppTheme.dataMono / GoogleFonts.jetBrainsMono)
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/JetBrainsMono-ExtraBold.ttf
          weight: 800
