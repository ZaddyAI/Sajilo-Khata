workflows:
  android-play-internal:
    name: Sajilo Khata - Google Play Internal Testing

    max_build_duration: 60

    environment:
      flutter: stable

      # Codemagic Environment Variable Group
      #
      # This group must contain:
      # GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
      #
      # The value must be the complete Google service-account
      # JSON key and must be marked as Secret.
      groups:
        - google_play_credentials

      # Android keystore reference from:
      # Codemagic -> Team settings -> Code signing identities
      android_signing:
        - sajilokhata_keystore

      vars:
        # Android application ID
        PACKAGE_NAME: "com.zaddyai.sajilokhata"

        # Google Play release track
        GOOGLE_PLAY_TRACK: "internal"

    scripts:

      # -----------------------------------------------
      # 1. Get Flutter dependencies
      # -----------------------------------------------
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      # -----------------------------------------------
      # 2. Run Flutter tests
      # -----------------------------------------------
      - name: Run Flutter tests
        script: |
          set -e
          flutter test

      # -----------------------------------------------
      # 3. Configure Android release signing
      # -----------------------------------------------
      - name: Configure Android signing
        script: |
          set -e

          cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF

      # -----------------------------------------------
      # 4. Get the next Google Play build number
      # -----------------------------------------------
      - name: Calculate build number
        script: |
          set -e

          echo "Checking Google Play for latest build number..."

          LATEST_BUILD_NUMBER=$(google-play get-latest-build-number \
            --package-name "$PACKAGE_NAME" \
            --tracks="$GOOGLE_PLAY_TRACK" 2>/dev/null || true)

          if [ -z "$LATEST_BUILD_NUMBER" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          fi

          echo "Package: $PACKAGE_NAME"
          echo "Track: $GOOGLE_PLAY_TRACK"
          echo "Latest build: ${LATEST_BUILD_NUMBER:-none}"
          echo "New build: $BUILD_NUMBER"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"

      # -----------------------------------------------
      # 5. Build Android App Bundle
      # -----------------------------------------------
      - name: Build Android App Bundle
        script: |
          set -e

          flutter build appbundle \
            --release \
            --build-number="$BUILD_NUMBER"

    # -----------------------------------------------
    # Build artifacts
    # -----------------------------------------------
    artifacts:
      - build/app/outputs/bundle/release/*.aab

    # -----------------------------------------------
    # Publish to Google Play Internal Testing
    # -----------------------------------------------
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal